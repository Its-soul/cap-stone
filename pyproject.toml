[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "certificate-recovery"
version = "0.1.0"
description = "Deterministic foundation for dependency-aware certificate invalidation and recovery"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
remote = [
    "gradio-client==2.7.2",
    "huggingface-hub==2.1.1",
    "python-dotenv==1.2.4",
]

[tool.setuptools.packages.find]
where = ["src"]

