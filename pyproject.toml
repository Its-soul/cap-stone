[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "certificate-recovery"
version = "0.1.0"
description = "Deterministic foundation for dependency-aware certificate invalidation and recovery"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
remote = [
    "gradio-client==2.7.2",
    "huggingface-hub==2.1.1",
    "python-dotenv==1.2.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "v2_checkpoint: opt-in, read-only inference using a private V2 run bundle",
    "core: Deterministic foundation, DAG operations, cryptographic hashing, and certificate recovery",
    "adjudication: Multi-agent insurance adjudication, consensus, specialist composition, and ablation",
    "ml: Machine learning dependency prediction pipelines, data preparation, and empirical evaluation",
    "slow: Tests with long execution duration or combinatorial generation",
    "integration: Cross-system integration and model checkpoint replay tests",
    "remote: Remote client and offline workflow replay tests",
]
