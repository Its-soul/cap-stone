execution:
  allow_data_preparation: false
  allow_model_inference: false
  allow_training: false
  allow_research_experiments: false

paths:
  raw_pairs: data/raw/dependency_pairs.jsonl
  processed: data/processed
  checkpoints: checkpoints/semantic-dependency
  results: results
  workflow_cases: data/raw/workflow_cases.jsonl

data:
  seed: 42
  train_fraction: 0.70
  validation_fraction: 0.15
  test_fraction: 0.15
  group_key: world_id

model:
  pretrained_id: cross-encoder/nli-deberta-v3-small
  revision: main
  max_length: 256
  inference_batch_size: 16
  entailment_label: entailment
  threshold_candidates: [0.20, 0.35, 0.50, 0.65, 0.80]
  calibration_bins: 10

training:
  seed: 42
  batch_size: 8
  learning_rate: 0.00002
  epochs: 3
  weight_decay: 0.01
  gradient_accumulation_steps: 1
  early_stopping_patience: 2
  early_stopping_threshold: 0.0
  save_total_limit: 2
  evaluation_strategy: epoch
  checkpoint_strategy: epoch
  best_model_metric: macro_f1
  greater_is_better: true
  fp16: false

recovery:
  analysis_cost_units: 1.0
  evidence_cost_units: 1.0
  claim_cost_units: 1.0
  certificate_cost_units: 3.0
  decision_cost_units: 1.0
  budget_units: null

evaluation:
  baselines: [A_full_recomputation, B_no_invalidation, C_invalidation_only, proposed]
  confidence_bins: 10
  bootstrap_seed: 42
  bootstrap_samples: 1000

